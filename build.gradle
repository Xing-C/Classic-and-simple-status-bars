plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    // 1.21.1 官方推荐构建插件
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id + "-NeoForge"
}

// 1.20.5 起官方运行时为 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run/client')
            if (project.hasProperty('qpWorld')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('qpWorld')
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run/server')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url "https://maven.ryanliptak.com/" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url "https://maven.greenhouse.lgbt/releases" }
    mavenCentral()
}

dependencies {
    // GeckoLib
    implementation "curse.maven:geckolib-388172:8893490" // neoforge-1.21.1-4.9.3
    // Curios API
    implementation "curse.maven:curios-309927:6529130" // curios-neoforge-9.5.1+1.21.1.jar
    // Caelus API
    implementation "curse.maven:caelus-308989:5694215" // caelus-neoforge-7.0.1+1.21.1.jar

    // 口渴 、 意志坚定
    compileOnly "curse.maven:thirst-was-taken-679270:7017923" // ThirstWasTaken-1.21.1-2.1.5.jar
    compileOnly "curse.maven:tough-as-nails-246391:5833252" // ToughAsNails-1.21.1-10.1.0.13
    // 稳态
    // 2.12.0.0 删掉了 subSeason 的 null 检查, 无季节模组时玩家进世界会 NPE, 故锁在 2.11.0.10
    compileOnly "curse.maven:homeostatic-634466:8287460" // homeostatic-neoforge-1.21.1-2.11.0.10.jar

    // 传说生存 Legendary Survival Overhaul - legendarysurvivaloverhaul-1.21.1-2.4.7.2.jar
    implementation "curse.maven:legendary-survival-overhaul-840254:8597620"
    // 静谧四季 SereneSeasons-neoforge-1.21.1-10.1.0.3.jar
    implementation "curse.maven:serene-seasons-291874:6182596"
    implementation "curse.maven:glitchcore-955399:8109792"

    // 测试用.
    implementation "curse.maven:jei-238222:8792638" // jei-1.21.1-neoforge-19.51.0.418.jar
    compileOnly "squeek.appleskin:appleskin-neoforge:mc1.21-3.0.9"
    compileOnly "squeek.appleskin:appleskin-neoforge:mc1.21-3.0.9:api"
    runtimeOnly "squeek.appleskin:appleskin-neoforge:mc1.21-3.0.9"
    implementation "curse.maven:jade-324717:8591319" // Jade-1.21.1-NeoForge-15.10.6.jar
    runtimeOnly "curse.maven:imblocker-483760:9033584" // IMBlocker-5.6.2.1-neoforge+1.20.6-1.21.8.jar
    runtimeOnly "curse.maven:just-enough-characters-250702:8771217" // jecharacters-1.21.1-neoforge-4.5.29.jar

    // 奇异饰品
    implementation "curse.maven:expandability-465066:5428824" // expandability-neoforge-12.0.0.jar
    implementation "curse.maven:architectury-api-419699:8492726" // architectury-13.0.11-neoforge.jar
    implementation "curse.maven:cloth-config-348521:5729127" // ClothConfigNeoForge-15.0.140.jar
    implementation "curse.maven:artifacts-312353:8791899" // artifacts-neoforge-13.2.5.jar

    // 跑酷
    compileOnly "curse.maven:parcool-482378:7478606" // ParCool-1.21.1-3.4.3.1-NF.jar

    // 吸血鬼 Vampirism-1.21-1.10.13.jar
    compileOnly "curse.maven:vampirism-233029:8814121"

    // Mekanism-1.21.1-10.7.19.85.jar
    implementation "curse.maven:mekanism-268560:7904058"

    // 过载盔甲条 Overloaded Armor Bar - overloadedarmorbar-neoforge-1.21-2.jar
    compileOnly "curse.maven:overloaded-armor-bar-314002:5537850"
    // Ok Zoomer 缩放 - ok_zoomer-neoforge-10.0.0-beta.13+neo.jar
    compileOnly "curse.maven:ok-zoomer-354047:7676612"

    // 1.21.1 暂无可用版本, 已移除支持:
    //   Feathers (699933) / Elenai Dodge 2 (442962) / Scaling Health (248027) / Silent Lib (242998)
    //   Super Saturation (431906) / Blue Skies (312918) / Structure Gel API (378802)
    //   Origins / Apoli / Calio (1.21.1 仅 Fabric, NeoForge 侧无版本)
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description, pack_format_number: pack_format_number,
    ]
    inputs.properties replaceProperties

    // 固定过滤编码: 不设则跟随 Gradle JVM 的默认编码, 中文注释在 GBK 下会被写坏, 导致 FML 解析 mods.toml 失败
    filteringCharset = 'UTF-8'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
tasks.register('idePostSync') {}